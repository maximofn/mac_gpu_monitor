[package]
name = "mac-gpu-monitord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "macOS GPU monitor daemon — HTTP/SSE backend serving GPU metrics."

[[bin]]
name = "mac-gpu-monitord"
path = "src/main.rs"

[dependencies]
mac-gpu-monitor-core = { path = "../mac-gpu-monitor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# sysinfo gives us host_name / kernel_version cheaply; the GPU data itself
# comes from macmon, not sysinfo.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Apple Silicon: GPU usage, temp, power, unified memory via macmon (IOReport,
# no sudo). macmon is aarch64-apple-darwin only — on Intel Macs the daemon
# falls back to null fields rather than failing to build.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
